<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="calculatorForm" action="">
      <fieldset>
        <legend>Lisseur CMP - Titre BRVM</legend>
        <div>
          <label for="actualNbreTitreEnPortefeuille"
            >Nombre de titres en portefeuille :</label
          >
          <input
            type="range"
            max="100"
            min="1"
            id="actualNbreTitreEnPortefeuille"
            name="actualNbreTitreEnPortefeuille"
            value="30"
            oninput="this.nextElementSibling.value = this.value"
          />
          <output style="display: inline-block; width: 50px; margin: 0 10px"
            >30</output
          >
        </div>

        <div>
          <label for="avgPricePerTitreEnProtefeuille"
            >Prix moyen des titres en portefeuille :</label
          >
          <input
            type="number"
            id="avgPricePerTitreEnProtefeuille"
            name="avgPricePerTitreEnProtefeuille"
            value="8416"
          />
        </div>

        <div>
          <label for="actualPriceTitreToBuy"
            >Prix actuel du titre à acheter :</label
          >
          <input
            type="number"
            id="actualPriceTitreToBuy"
            name="actualPriceTitreToBuy"
            value="8000"
          />
        </div>

        <div>
          <label for="targetAvgPricePerTitre"
            >Prix moyen cible par titre :</label
          >
          <input
            type="number"
            id="targetAvgPricePerTitre"
            name="targetAvgPricePerTitre"
            value="8200"
          />
        </div>

        <button type="submit">Calculer</button>
        <div id="result"></div>
      </fieldset>
    </form>

    <footer>
      <p>&copy; 2026 Serge Toure. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
